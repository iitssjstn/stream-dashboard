name: Build & publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
      minor: ${{ steps.v.outputs.minor }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: Is this a new version?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          for f in server/package.json web/package.json; do
            [ "$(node -p "require('./$f').version")" = "$v" ] || { echo "::error::$f heeft niet versie $v"; exit 1; }
          done
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          # A release happens on main when no tag exists yet for the version in package.json.
          if [ "$GITHUB_REF" = "refs/heads/main" ] && ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$v" >/dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Nieuwe versie: v$v"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Typecheck & end-to-end test
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm run install:all
      - run: npm run typecheck
      - run: npm run build
      - name: Install Playwright (Chromium)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          # No --with-deps: the runner already has the system libraries, and apt would only add extra fonts.
          npx playwright install chromium
      - name: End-to-end test (chat -> overlay)
        run: node e2e/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: e2e/output/*.png
          if-no-files-found: ignore

  docker:
    name: Docker image
    needs: [version, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.minor }},enable=${{ needs.version.outputs.release == 'true' }}
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub Release
    if: needs.version.outputs.release == 'true'
    needs: [version, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$V" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
          printf '\n---\nDocker: `ghcr.io/%s:%s`\n' "$GITHUB_REPOSITORY" "$V" >> notes.md
          cat notes.md
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ needs.version.outputs.version }}
        run: gh release create "v$V" --target "$GITHUB_SHA" --title "Waviloop v$V – Make your stream come alive." --notes-file notes.md
