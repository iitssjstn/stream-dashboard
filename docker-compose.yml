services:
  lumio:
    # Prebuilt by GitHub Actions (.github/workflows/build.yml). `docker compose up -d --build` builds locally instead.
    image: ghcr.io/iitssjstn/stream-dashboard:latest
    build: .
    container_name: stream-dashboard
    restart: unless-stopped
    # No credentials here: Twitch Client ID/Secret are entered in the setup wizard on the website
    # and stored encrypted in the data volume.
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PORT: 3000
      DATA_DIR: /data
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - lumio-data:/data

volumes:
  lumio-data:
