services:
  lumio:
    # Prebuilt by GitHub Actions (.github/workflows/build.yml). `docker compose up -d --build` builds locally instead.
    image: ghcr.io/iitssjstn/stream-dashboard:latest
    build: .
    container_name: stream-dashboard
    restart: unless-stopped
    environment:
      # Only non-secret settings here. Credentials come from the secrets below.
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      PORT: 3000
      DATA_DIR: /data
    secrets:
      - twitch_client_id
      - twitch_client_secret
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - lumio-data:/data

# Mounted read-only at /run/secrets/<name>; never part of the container environment.
secrets:
  twitch_client_id:
    file: ./secrets/twitch_client_id
  twitch_client_secret:
    file: ./secrets/twitch_client_secret

volumes:
  lumio-data:
